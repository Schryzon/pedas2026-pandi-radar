name: Keep Dashboard Alive

on:
  schedule:
    # Run every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Headless Browser Keep-Alive
        run: |
          python wake_app.py

      - name: Upload Diagnostic Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wake-diagnostic-screenshot
          path: wake_attempt_screenshot.png
          if-no-files-found: ignore
